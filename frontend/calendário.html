<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="tela">

        <h2>SELECIONE O DIA:</h2>

        <section class="calendario">

            <div class="cabecalho-calendario">
                JULHO 2026
            </div>

            <div class="dias-semana">
                <span>D</span>
                <span>S</span>
                <span>T</span>
                <span>Q</span>
                <span>Q</span>
                <span>S</span>
                <span>S</span>
            </div>

            <div class="dias">

                <span class="fora">28</span>
                <span class="fora">29</span>
                <span class="fora">30</span>

                <button class="dia" onclick="selecionarDia(1)">1</button>

                <button class="dia" onclick="selecionarDia(2)">2</button>

                <button class="dia reservado">3</button>

                <button class="dia" onclick="selecionarDia(4)">4</button>

                <button class="dia" onclick="selecionarDia(5)">5</button>

                <button class="dia disponivel" onclick="selecionarDia(6)">6</button>

                <button class="dia" onclick="selecionarDia(7)">7</button>

                <button class="dia" onclick="selecionarDia(8)">8</button>

                <button class="dia" onclick="selecionarDia(9)">9</button>

                <button class="dia" onclick="selecionarDia(10)">10</button>

                <button class="dia" onclick="selecionarDia(11)">11</button>

                <button class="dia" onclick="selecionarDia(12)">12</button>

                <button class="dia" onclick="selecionarDia(13)">13</button>

                <button class="dia" onclick="selecionarDia(14)">14</button>

                <button class="dia reservado">15</button>

                <button class="dia" onclick="selecionarDia(16)">16</button>

                <button class="dia" onclick="selecionarDia(17)">17</button>

                <button class="dia" onclick="selecionarDia(18)">18</button>

                <button class="dia" onclick="selecionarDia(19)">19</button>

                <button class="dia" onclick="selecionarDia(20)">20</button>

                <button class="dia" onclick="selecionarDia(21)">21</button>

                <button class="dia" onclick="selecionarDia(22)">22</button>

                <button class="dia" onclick="selecionarDia(23)">23</button>

                <button class="dia" onclick="selecionarDia(24)">24</button>

                <button class="dia" onclick="selecionarDia(25)">25</button>

                <button class="dia" onclick="selecionarDia(26)">26</button>

                <button class="dia" onclick="selecionarDia(27)">27</button>

                <button class="dia" onclick="selecionarDia(28)">28</button>

                <button class="dia" onclick="selecionarDia(29)">29</button>

                <button class="dia" onclick="selecionarDia(30)">30</button>

                <button class="dia" onclick="selecionarDia(31)">31</button>

            </div>

        </section>

        <section class="legenda">

            <div class="legenda-item">
                <span class="bolinha vermelho"></span>
                <span>RESERVADO TODOS OS HORÁRIOS</span>
            </div>

            <div class="legenda-item">
                <span class="bolinha amarelo"></span>
                <span>AINDA HÁ HORÁRIOS DISPONÍVEIS</span>
            </div>

        </section>

    </main>

    <script src="js/calendario.js"></script>

</body>

</html>
