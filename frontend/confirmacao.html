    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Concluída</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

        <div class="conteudo">

                <br>

                <button

                    Nova Reserva

                </button>

                <button
                    class="botao-principal"
                    onclick="verReservas()">

                    Minhas Reservas

                </button>

            </div>

        </div>

    </div>

    <script src="js/confirmacao.js"></script>
