<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirmação</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Reserva realizada!</h1>

        <p id="resultado"></p>

        <button onclick="voltarInicio()">
            Voltar para o início
        </button>

    </div>


    <script>

        const ambiente =
            localStorage.getItem("ambiente");

        const materia =
            localStorage.getItem("materia");

        const data =
            localStorage.getItem("data");

        const hora =
            localStorage.getItem("hora");


        document.getElementById(
            "resultado"
        ).innerHTML = `

            <strong>Ambiente:</strong>
            ${ambiente}
            <br><br>

            <strong>Matéria:</strong>
            ${materia}
            <br><br>

            <strong>Data:</strong>
            ${data}
            <br><br>

            <strong>Horário:</strong>
            ${hora}

        `;


        function voltarInicio() {

            window.location.href =
                "ambientes.html";

        }

    </script>

</body>

</html>
